#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Disable effects
#################################

fading = false;
shadow = false;
blur-method = "none";

#################################
# Rounded corners
#################################

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Transparency
#################################

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "92:class_g = 'kitty'"
];

#################################
# Performance
#################################

use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
