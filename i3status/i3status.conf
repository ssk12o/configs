# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5 
}

#order += "ipv6"
order += "ethernet _first_"
order += "wireless _first_"
order += "battery all"
order += "disk /"
order += "load"
order += "cpu_temperature 8"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "5G (%quality at %essid) Leaked IP: %ip"
        format_down = "tinfol-hatters won"
}

ethernet _first_ {
        format_up = "Wirezz %ip (%speed)"
        format_down = "Ea-Nasir"
}

battery all {
        format = "Magic powder %status %percentage %remaining %emptytime"
        format_down = "No magic powder"
        path = "/sys/class/power_supply/BAT%d/uevent"
        low_threshold = 10
}

disk "/" {
        format = "Yaoi %avail"
}

load {
        format = "Load %1min"
}

cpu_temperature 8 {
    format = "Tea %degrees"
    path = "/sys/class/thermal/thermal_zone8/temp"
  }

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%d-%m-%Y %H:%M:%S"
}
